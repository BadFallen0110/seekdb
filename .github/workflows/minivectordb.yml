name: MiniVectorDB

on:
  push:
    branches:
      - 2026-competition-round2
  pull_request:
    branches:
      - 2026-competition-round2

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag minivectordb:ci .

      - name: Run SQL smoke test
        shell: bash
        run: |
          set -euo pipefail
          output="$(
            printf '%s\n' \
              "CREATE TABLE docs (id BIGINT PRIMARY KEY, body VARCHAR(16), embedding VECTOR(2));" \
              "INSERT INTO docs VALUES (2,'second','[0,1]'),(1,'first','[1,0]');" \
              "SELECT id, body, L2_DISTANCE(embedding,'[1,0]') AS d FROM docs ORDER BY d LIMIT 2;" \
              "QUIT;" |
              docker run --rm -i --cpus=2 --memory=2g minivectordb:ci
          )"
          printf '%s\n' "$output"
          grep -F "ROW	1	first	0" <<<"$output"
          grep -F "ROW	2	second	1" <<<"$output"
