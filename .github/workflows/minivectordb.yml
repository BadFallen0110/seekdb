name: MiniVectorDB

on:
  push:
    branches:
      - 2026-competition-round2
  pull_request:
    branches:
      - 2026-competition-round2

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build --tag minivectordb:ci .

      - name: Check official JSONL handshake
        run: |
          python3 protocol_check/run.py \
            --image minivectordb:ci \
            --handshake-only \
            --output protocol-results/handshake

      - name: Run official public protocol cases
        shell: bash
        run: |
          set -euo pipefail
          python3 protocol_check/run.py \
            --image minivectordb:ci \
            --output protocol-results/public

      - name: Preserve protocol reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-results
          path: protocol-results
